name: Update dashboard data

on:
  schedule:
    - cron: "15 3 * * *"   # daily ~06:15 Israel time
    - cron: "15 9 * * *"   # midday refresh (late Meta/Google attribution)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch from Windsor.ai
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: python scripts/fetch_windsor.py
      - name: Build team dashboard data (encrypted)
        continue-on-error: true   # never block the client dashboard refresh
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          INTERNAL_PASSWORD: ${{ secrets.INTERNAL_PASSWORD }}
        run: |
          pip install -q cryptography
          python scripts/fetch_internal.py
      - name: Commit data
        run: |
          git config user.name "fore-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if [ -f team/data.enc.json ]; then git add team/data.enc.json; fi
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          git push
